server {
    listen 80;
    listen [::]:80;
    server_name mentorios.tech www.mentorios.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/mentorios-site;
        try_files $uri =404;
    }

    location / {
        return 301 https://mentorios.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mentorios.tech;

    ssl_certificate /etc/letsencrypt/live/mentorios.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorios.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mentorios.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mentorios.tech;

    root /var/www/mentorios-site;
    index index.html;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mentorios.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorios.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 256;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /index.html {
        # For a direct /index.html request keep the public URL clean.
        # Internal index resolution keeps $request_uri as "/" and serves the file.
        if ($request_uri = /index.html) {
            return 301 /;
        }
    }

    location = /yandex_dadaa969d58e5279.html {
        try_files $uri =404;
    }

    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|avif|ico|woff2|webm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
